[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "userscope"
version = "0.1.0"
description = "UserScope — username intelligence dashboard. Find social media accounts by username. 100% free, no paid APIs."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.22.0",
    "requests-futures>=1.0.0",
    "certifi>=2019.6.16",
    "colorama>=0.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]